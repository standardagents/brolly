name: Deploy Brolly Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-brolly-docs-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build static SSR site
        run: |
          pnpm --filter @standardagents/brolly-docs typecheck
          pnpm build:docs

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter @standardagents/brolly-docs deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
