name: Deploy Brolly Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-brolly-docs-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build static SSR site
        run: |
          pnpm --filter @standardagents/brolly-docs typecheck
          pnpm build:docs

      - name: Build and verify isolated Deploy Button template
        run: |
          pnpm build:deploy-template
          npm --prefix deploy run build
          pnpm exec vitest run apps/guard-worker/test/deploy-button.test.ts

      - name: Publish Deploy Button template branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy
          if ! git diff --cached --quiet; then
            git commit -m "build(deploy): publish ${GITHUB_SHA}"
          fi
          git subtree split --prefix=deploy --branch deploy-template
          git push --force origin deploy-template

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter @standardagents/brolly-docs deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
