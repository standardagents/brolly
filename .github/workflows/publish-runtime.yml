name: Publish Brolly Runtime

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.release.outputs.dist_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Validate release tag and package version
        id: release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./packages/runtime/package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match runtime package version $PACKAGE_VERSION."
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([a-z][a-z0-9-]*)\.([0-9a-f]+)$ ]]; then
            echo "dist_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Use vX.Y.Z or vX.Y.Z-<dist-tag>.<commit>."
            exit 1
          fi

      - name: Require stable releases to come from main
        if: steps.release.outputs.prerelease == 'false'
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install current npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime package
        run: pnpm verify:runtime-release

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install current npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime package
        run: pnpm --filter @standardagents/brolly-runtime build

      - name: Publish with npm trusted publishing
        working-directory: packages/runtime
        run: npm publish --provenance --tag "${{ needs.build.outputs.dist-tag }}"

  release:
    needs: [build, publish]
    if: needs.publish.result == 'success' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Create GitHub release
        run: npx changelogithub@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
